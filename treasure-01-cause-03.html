<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藏寶圖第一站：病因射箭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 和看見星世界系列同一套配色：淺藍灰底、深藍字、橘色重點；只用淺色主題 */
:root {
  --paper: #DEE5EE;
  --card: #F7F9FB;
  --navy: #141B7A;
  --ink: #1E2748;
  --muted: #3B4260;
  --orange: #E8673C;
  --coral: #F3835E;
  --yellow: #FFE04F;
  --sky: #CFDDF0;
  --line: #B9C8DC;
  --green: #1F6E2A;
  --ok-bg: #E5F5E2;
  --no-bg: #FDE9E0;
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: only light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 28px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* 頂部 */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.station { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; font-family: var(--f-display); font-size: 1.05rem; padding: 4px 16px 4px 6px; border-radius: 999px; white-space: nowrap; }
.station .no { background: var(--yellow); color: var(--navy); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.top .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 3px solid var(--navy); background: #fff; color: var(--navy); font-weight: 700; font-size: 1rem; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
.pill svg { width: 20px; height: 20px; }
.pill.hot { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill[aria-pressed="false"] .wave { display: none; }

/* 題目區 */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; margin-top: 14px; background: var(--card); border: 3px solid var(--line); border-radius: 28px; padding: 16px 20px; }
.hero .chest { width: clamp(92px, 20vw, 150px); grid-row: span 2; }
.hero h1 { font-family: var(--f-display); font-weight: 400; color: var(--navy); font-size: clamp(1.6rem, 5.2vw, 2.5rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.hero .lead { margin: 0; color: var(--muted); font-size: clamp(1.02rem, 2.6vw, 1.2rem); }
.hero .tools { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* 射箭：旋轉抽獎盤 */
.game { display: grid; grid-template-areas: "hero" "wheel" "act"; gap: 14px; margin-top: 14px; justify-items: center; }
.game .hero { grid-area: hero; margin-top: 0; width: 100%; }
.wheel-wrap { grid-area: wheel; position: relative; width: min(calc(100vw - 32px), 58vh, 470px); width: min(calc(100vw - 32px), 58dvh, 470px); aspect-ratio: 1; cursor: pointer; touch-action: manipulation; }
#wheel { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 8px 0 rgba(20, 27, 122, .18)); }
.pointer { position: absolute; left: 50%; top: -4%; width: 13%; transform: translateX(-50%); z-index: 3; filter: drop-shadow(0 3px 0 rgba(20, 27, 122, .25)); }
.fly { position: absolute; left: 50%; top: 23.75%; width: 9%; margin-left: -4.5%; z-index: 4; transform-origin: 50% 0; opacity: 0; pointer-events: none; }
.sector .pic { transition: filter .4s; }
.spark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; }
.spark .ring { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 6px solid #FFE04F; box-shadow: 0 0 18px 6px rgba(255, 224, 79, .8), inset 0 0 12px rgba(255, 255, 255, .9); animation: ring .7s ease-out forwards; }
.spark .ring.r2 { border-color: #fff; animation-delay: .15s; opacity: 0; }
.spark .ring.r3 { animation-delay: .3s; opacity: 0; }
.sector.bull.hit .glow { animation: glow .35s ease-in-out 6 alternate; }
@keyframes ring { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
.spark i { position: absolute; left: -12px; top: -14px; font-style: normal; font-size: 26px; text-shadow: 0 0 8px rgba(255, 224, 79, .9), 0 0 2px #141B7A; animation: burst 1.1s cubic-bezier(.2, .8, .3, 1) var(--d) forwards; opacity: 0; }
@keyframes burst { 0% { transform: translate(0, 0) scale(.3) rotate(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(160deg); opacity: 0; } }
.spark b { position: absolute; left: 0; top: -130px; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-display); font-weight: 400; font-size: clamp(1.4rem, 5vw, 2rem); color: #fff; background: #E8473A; border: 4px solid #FFE04F; border-radius: 999px; padding: 2px 18px; box-shadow: 0 4px 0 #141B7A; animation: pop 1.6s ease-out forwards; }
@keyframes pop { 0% { transform: translateX(-50%) scale(.3); opacity: 0; } 15% { transform: translateX(-50%) scale(1.15); opacity: 1; } 25% { transform: translateX(-50%) scale(1); } 80% { opacity: 1; } 100% { transform: translateX(-50%) translateY(-14px); opacity: 0; } }
.sector .out { opacity: 0; transition: opacity .4s; }
.sector.used .out { opacity: 1; }
.sector.used .pic { filter: grayscale(1) opacity(.55); }
.sector.hit .glow { opacity: 1; animation: glow .5s ease-in-out 4 alternate; }
.sector .glow { opacity: 0; }
@keyframes glow { to { opacity: .15; } }
.sector .glow { mix-blend-mode: screen; }
.act { grid-area: act; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.thrower { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
.thrower:focus-visible { outline: 5px solid var(--orange); outline-offset: 4px; border-radius: 20px; }
#kid { width: clamp(110px, 32vw, 150px); height: auto; overflow: visible; }
#kid .body { transform-origin: 80px 166px; transition: transform .15s; }
#kid .face-aim { display: none; }
#arm { transform-box: view-box; transform-origin: 108px 104px; transition: transform .12s; }
.thrower:not(:disabled) #kid { animation: kidbob 1.6s ease-in-out infinite; }
@keyframes kidbob { 50% { transform: translateY(-4px); } }
.thrower.charging #kid { animation: none; }
.thrower.charging #kid .body { transform: scaleY(.95) rotate(-3deg); }
.thrower.charging .face-aim { display: inline; }
.thrower.charging .face-calm { display: none; }
.thrower.charging #arm { transform: rotate(calc(var(--pull, 0) * 55deg)); transition: none; }
.thrower.fling #arm { transform: rotate(-35deg); transition: transform .09s ease-out; }
.thrower.empty .held { opacity: 0; }
.thrower:disabled { cursor: default; }
.thrower:disabled .tip { background: #9AA3B8; box-shadow: 0 4px 0 #6B7488; }
.power { width: clamp(110px, 30vw, 150px); height: 12px; border-radius: 6px; background: #fff; border: 3px solid var(--navy); overflow: hidden; }
.power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #FFE04F, #E8673C); }
.tip { margin-top: 4px; font-family: var(--f-display); color: #fff; background: var(--orange); border-radius: 999px; padding: 6px 20px; font-size: clamp(1.15rem, 4.4vw, 1.4rem); box-shadow: 0 4px 0 #A8401A; white-space: nowrap; }
.darts { display: flex; gap: 8px; align-items: center; font-weight: 700; color: var(--navy); font-size: 1.05rem; }
.darts i { width: 14px; height: 30px; border-radius: 7px; background: var(--orange); display: inline-block; border: 2px solid var(--navy); }
.darts i.used { background: #C9CED9; border-color: #8A92A8; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sheet .hitrow { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.sheet .hitrow img { width: 84px; height: 84px; object-fit: contain; flex: none; filter: grayscale(.3); }
.sheet .hitrow p { margin: 0; }
.sheet .hitrow p b { color: #A8401A; }
.sheet-acts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }

/* 答錯提示：底部卡片 */
.sheet-bg, .win-bg { position: fixed; inset: 0; z-index: 40; background: rgba(20, 27, 122, .35); display: flex; align-items: flex-end; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.show, .win-bg.show { opacity: 1; pointer-events: auto; }
.sheet { width: min(640px, 100%); background: var(--no-bg); border: 4px solid var(--orange); border-radius: 28px; padding: 18px 20px 20px; transform: translateY(40px); transition: transform .3s; max-height: 90vh; overflow: auto; }
.sheet-bg.show .sheet { transform: none; }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .verdict { font-family: var(--f-display); font-size: clamp(1.5rem, 5vw, 2rem); color: #A8401A; flex: 1; }
.sheet p { margin: 8px 0 14px; font-size: clamp(1.1rem, 3.6vw, 1.3rem); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--orange); color: #fff; font-family: var(--f-display); font-size: clamp(1.25rem, 4vw, 1.5rem); padding: 10px 28px; border-radius: 999px; box-shadow: 0 5px 0 #A8401A; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #A8401A; }
.btn.ghost { background: #fff; color: var(--navy); border: 3px solid var(--navy); box-shadow: 0 5px 0 var(--navy); }

/* 答對：寶箱打開 + 關卡章 */
.win-bg { align-items: center; background: rgba(20, 27, 122, .55); }
.win { width: min(720px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--card); border: 5px solid var(--yellow); border-radius: 32px; padding: 18px 20px 22px; text-align: center; transform: scale(.85); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
.win-bg.show .win { transform: none; }
.win-title { font-family: var(--f-display); color: var(--green); font-size: clamp(2rem, 7vw, 3rem); line-height: 1.2; margin: 0; }
.win-body { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: center; justify-items: center; }
.scene { position: relative; width: min(300px, 70vw); aspect-ratio: 1 / .78; }
.scene .bigchest { position: absolute; inset: auto 0 0 0; width: 100%; }
.scene .lid { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .6s cubic-bezier(.3, 1.6, .5, 1) .2s; }
.win-bg.show .scene .lid { transform: translateY(-14%) rotate(-24deg); }
.scene .rays { opacity: 0; transform-origin: 160px 150px; transition: opacity .4s .5s; }
.win-bg.show .scene .rays { opacity: 1; animation: spin 10s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stamp { position: absolute; left: 50%; top: 2%; width: 50%; transform: translate(-50%, 40%) scale(.2) rotate(-30deg); opacity: 0; transition: transform .7s cubic-bezier(.2, 1.5, .4, 1) .7s, opacity .3s .7s; }
.win-bg.show .stamp { transform: translate(-50%, 0) scale(1) rotate(-8deg); opacity: 1; }
.win .exp { background: var(--ok-bg); border: 3px solid #9FD19A; border-radius: 20px; padding: 12px 16px; text-align: left; font-size: clamp(1.08rem, 3.4vw, 1.25rem); margin: 6px 0 0; }
.win .exp b { color: var(--navy); }
.win .exp .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-family: var(--f-display); color: var(--green); font-size: 1.25rem; }
.win .exp .row .grow { flex: 1; }
.win .show-staff { margin: 12px 0 14px; font-weight: 700; color: var(--navy); font-size: clamp(1.05rem, 3.4vw, 1.2rem); }
.win .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.got { display: none; align-items: center; gap: 10px; margin-top: 18px; background: #fff; border: 3px dashed var(--green); border-radius: 22px; padding: 10px 14px; }
.got.show { display: flex; }
.got svg { width: 64px; height: 64px; flex: none; }
.got .t { flex: 1; font-weight: 700; color: var(--green); font-size: 1.1rem; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

@media (min-width: 760px) {
  .win-body { grid-template-columns: auto 1fr; gap: 18px; }
}
/* 橫的畫面：盤子在左，題目和按鈕在右 */
@media (orientation: landscape) and (min-width: 600px) {
  .game { grid-template-areas: "wheel hero" "wheel act"; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; align-items: start; gap: 12px 22px; }
  .wheel-wrap { width: min(calc(100vh - 120px), 46vw, 520px); width: min(calc(100dvh - 120px), 46vw, 520px); margin-top: 10px; }
  .act { align-self: center; }
  .wheel-wrap { max-width: 480px; }
  .hero .chest { width: 84px; }
  .hero h1 { font-size: clamp(1.4rem, 2.6vw, 2rem); }
}
/* 手機橫放（高度很矮）：壓縮版面 */
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 8px; padding-bottom: 12px; }
  .game { margin-top: 6px; }
  .wheel-wrap { width: min(calc(100dvh - 76px), 46vw); margin-top: 8px; }
  .hero { padding: 8px 14px; gap: 2px 12px; border-radius: 22px; }
  .hero .chest { width: 64px; }
  .hero h1 { font-size: 1.45rem; }
  .hero .lead { font-size: .98rem; }
  #kid { width: 86px; }
  .power { width: 100px; height: 10px; }
  .tip { font-size: 1.05rem; padding: 3px 14px; }
  .win { padding: 10px 16px 14px; }
  .win-title { font-size: 1.8rem; }
  .win-body { grid-template-columns: auto 1fr; gap: 14px; }
  .scene { width: 190px; }
  .win .exp { font-size: 1rem; }
  .win .show-staff { margin: 6px 0 8px; }
}
@media (orientation: landscape) and (max-height: 400px) {
  .hero .chest { display: none; }
  .hero { grid-template-columns: 1fr; }
  .hero .tools { grid-column: 1; }
  .hero h1 { font-size: 1.35rem; }
  .act { gap: 4px; }
}
@media (orientation: portrait) {
  .game { gap: 8px; }
  .wheel-wrap { width: min(calc(100vw - 48px), 42vh, 470px); width: min(calc(100vw - 48px), 42dvh, 470px); }
  #kid { width: clamp(84px, 24vw, 130px); }
}
@media (max-width: 420px) {
  .hero .chest { width: 70px; }
  .hero { grid-template-columns: auto 1fr; padding: 12px 14px; }
  .hero .tools { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* ===== 3D 房間：箭靶掛在前方牆上，小人背對我們面向靶 ===== */
.wrap { max-width: 1100px; padding-bottom: 12px; }
.scene3d { position: relative; margin-top: 10px; height: calc(100vh - 80px); height: calc(100dvh - 80px); min-height: 430px; container-type: size; overflow: hidden; border-radius: 26px; border: 3px solid var(--line); background: #DCE5F0; }
.room { position: absolute; inset: 0; perspective: 480px; perspective-origin: 50% 20%; pointer-events: none; }
.room .wall { position: absolute; left: 0; right: 0; top: 0; height: 68%; background:
  repeating-linear-gradient(90deg, rgba(255, 255, 255, .28) 0 46px, rgba(255, 255, 255, 0) 46px 92px),
  linear-gradient(180deg, #E7EDF5, #CDD9E8); border-bottom: 12px solid #9FB2CB; box-shadow: 0 6px 0 #7E93B0; }
.room .floor { position: absolute; left: -80%; width: 260%; top: 68%; height: 150%; transform-origin: 50% 0; transform: rotateX(76deg); background:
  repeating-linear-gradient(0deg, rgba(120, 80, 40, 0) 0 180px, rgba(120, 80, 40, .35) 180px 184px),
  repeating-linear-gradient(90deg, #EBCB9C 0 64px, #D7AF7B 64px 68px); }
.room .floor .line { position: absolute; left: 50%; top: 7%; width: 30%; transform: translateX(-50%); height: 26px; background: #E8673C; border: 4px solid #141B7A; border-radius: 6px; color: #fff; font-family: var(--f-display); font-size: 20px; text-align: center; line-height: 18px; letter-spacing: .4em; }
.room .spot { position: absolute; left: 50%; top: 40%; width: 120cqw; height: 120cqw; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255, 255, 255, .85) 0, rgba(255, 255, 255, 0) 45%); }
.room .bunting { position: absolute; left: 0; top: 0; width: 100%; height: 6cqh; }

.sign { position: absolute; z-index: 3; left: 50%; top: 4cqh; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; width: max-content; max-width: 94cqw; background: #fff; border: 4px solid var(--navy); border-radius: 18px; padding: 6px 10px 6px 18px; box-shadow: 0 5px 0 var(--navy); }
.sign h1 { margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--navy); font-size: clamp(1.2rem, 5.6cqw, 2.1rem); line-height: 1.25; text-wrap: balance; }

.scene3d .wheel-wrap { position: absolute; z-index: 2; left: 50%; top: 17cqh; margin: 0; width: min(80cqw, 43cqh); transform: translateX(-50%); }
.scene3d .wheel-wrap::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: -5%; height: 8%; border-radius: 50%; background: rgba(20, 27, 122, .14); z-index: -1; filter: blur(4px); }

.scene3d .thrower { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 37cqh; display: block; }
.scene3d #kid { position: absolute; right: 3cqw; bottom: -2cqh; height: 88%; width: auto; animation: none; }
.thrower:not(:disabled) #kid .body, .thrower:not(:disabled) #arm { animation: kidbob 1.6s ease-in-out infinite; }
.scene3d #kid .body { transform-origin: 100px 230px; }
.scene3d #arm { transform-origin: 146px 166px; }
.scene3d .thrower.charging #kid .body { transform: scale(1.03) rotate(2deg); animation: none; }
.scene3d .thrower.charging #arm { transform: rotate(calc(var(--pull, 0) * 32deg)); animation: none; }
.scene3d .thrower.fling #arm { transform: rotate(-22deg); animation: none; }
.scene3d .hud { position: absolute; left: 4cqw; bottom: 5cqh; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.scene3d .power { width: min(34cqw, 170px); }
.scene3d .tip { white-space: normal; text-align: center; line-height: 1.25; padding: 6px 16px; font-size: clamp(1.05rem, 4.6cqw, 1.4rem); }
.scene3d .darts { background: rgba(255, 255, 255, .9); border-radius: 999px; padding: 2px 10px; gap: 5px; font-size: .95rem; white-space: nowrap; }
.scene3d .darts i { width: 11px; height: 24px; }
.scene3d .got { position: absolute; z-index: 6; left: 3cqw; right: 3cqw; bottom: 3cqh; margin: 0; }

/* 橫的畫面：靶在中間偏左，小人在右下 */
@container (orientation: landscape) {
  .room .wall, .room .floor { }
  .sign { top: 10cqh; left: 3cqw; transform: none; max-width: 31cqw; flex-direction: column; align-items: flex-start; padding: 8px 14px; }
  .sign h1 { font-size: clamp(1.1rem, 3cqw, 1.9rem); }
  .scene3d .wheel-wrap { top: 9cqh; left: 55%; width: min(64cqh, 40cqw); }
  .scene3d .thrower { height: 50cqh; }
  .scene3d #kid { right: 5cqw; height: 100%; }
  .scene3d .tip { font-size: clamp(1rem, 2.4cqw, 1.3rem); }
  .scene3d .power { width: min(22cqw, 170px); }
}
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 6px; }
  .scene3d { margin-top: 6px; height: calc(100dvh - 60px); min-height: 300px; }
}
.scene3d .thrower:not(:disabled) #kid { animation: kidbob 1.8s ease-in-out infinite; }
.scene3d .thrower.charging #kid, .scene3d #kid .body { animation: none !important; transform: none !important; }
.scene3d .thrower.full #kid { animation: shake .12s linear infinite !important; }
.scene3d .thrower.full .tip { background: #C62A1E; }
@keyframes shake { 50% { transform: translateX(1.5px); } }
.scene3d #kid { right: 2cqw; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sfx" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></symbol>

  /* ---------- 旋轉箭靶 ---------- */
  // 正中間的紅心 = 正確答案（腦功能異常）；外圈三格 = 其他陪襯答案，外圈一直轉
  const FILLS = ["#FFE9A8", "#CFE3FF", "#D5F0DA"];
  const pt = (a, r) => [200 + r * Math.sin(a * Math.PI / 180), 200 - r * Math.cos(a * Math.PI / 180)];
  let bullAt = 1, order = [], used = new Set(), R = 0, state = "spin", thrown = 0, lastT = 0, fly = null, slow = null;
  const SPIN = 120;           // 外圈平常轉速（度／秒）
  const FLIGHT = 520;         // 箭飛行時間（毫秒）
  const HIT_R = 118;          // 射中外圈時的位置（距離圓心）
  const BULL = OPTS.find(o => o.ok);

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function ringSector(i, r0, r1) {
    const a0 = i * 120, a1 = a0 + 120;
    const [x1, y1] = pt(a0, r1), [x2, y2] = pt(a1, r1), [x3, y3] = pt(a1, r0), [x4, y4] = pt(a0, r0);
    return `M${x1} ${y1} A${r1} ${r1} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r0} ${r0} 0 0 0 ${x4} ${y4} Z`;
  }
  function build() {
    $("#got").classList.remove("show");
    order = shuffle(OPTS.filter(o => !o.ok)); used = new Set(); thrown = 0;
    let last = 0; try { last = +localStorage.getItem("cause-bull-at") || 0; } catch (e) {}
    // 第 1～4 支都可能正中紅心，每局隨機，而且不跟上一局一樣
    const choices = [1, 2, 3, 4].filter(n => n !== last);
    bullAt = choices[Math.floor(Math.random() * choices.length)];
    try { localStorage.setItem("cause-bull-at", bullAt); } catch (e) {}
    $("#rot").innerHTML = order.map((o, i) => `
      <g class="sector" data-id="${o.id}">
        <path d="${ringSector(i, 90, 186)}" fill="${FILLS[i]}" stroke="#141B7A" stroke-width="4"/>
        <path class="glow" d="${ringSector(i, 90, 186)}" fill="#FFE04F"/>
        <g transform="rotate(${i * 120 + 60} 200 200)">
          <image class="pic" href="${PICS[o.id]}" x="166" y="${200 - HIT_R - 34}" width="68" height="68"/>
          <rect x="${200 - (o.label.length * 10 + 14)}" y="17" width="${o.label.length * 20 + 28}" height="32" rx="16" fill="#fff" stroke="#141B7A" stroke-width="3"/>
          <text x="200" y="40" text-anchor="middle" font-family="Huninn, 'Noto Sans TC', sans-serif" font-size="20" fill="#141B7A">${o.label}</text>
          <g class="out"><path d="M176 58 L224 106 M224 58 L176 106" stroke="#E8673C" stroke-width="10" stroke-linecap="round"/></g>
        </g>
      </g>`).join("") + `
      <circle cx="200" cy="200" r="193" fill="none" stroke="#141B7A" stroke-width="14"/>
      ${Array.from({ length: 24 }, (_, k) => { const [x, y] = pt(k * 15, 193); return `<circle cx="${x}" cy="${y}" r="4" fill="${k % 2 ? "#FFE04F" : "#fff"}"/>`; }).join("")}
      <g id="stuck"></g>`;

    if (!n) {
      n = document.createElement("div"); n.id = "speak-notice"; n.setAttribute("role", "alert");
      n.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;max-width:min(92vw,560px);background:#141B7A;color:#fff;padding:14px 20px;border-radius:18px;font-size:1.1rem;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)";
      document.body.appendChild(n);
    }
    n.textContent = msg; n.hidden = false;
    let top = false; try { top = window.top === window; } catch (e) {}
    if (top && /^https?:/.test(location.protocol) && /Android/i.test(navigator.userAgent)) {
      const a = document.createElement("a");
      a.href = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=${location.protocol.slice(0, -1)};package=com.android.chrome;end`;
      a.textContent = "用 Chrome 開啟"; a.style.cssText = "display:inline-block;margin-top:8px;background:#FFE04F;color:#141B7A;font-weight:700;padding:4px 14px;border-radius:999px;text-decoration:none";
      n.appendChild(document.createElement("br")); n.appendChild(a);
    }
    clearTimeout(n._t); n._t = setTimeout(() => { n.hidden = true; }, 6000);
  }
  // 手機會把太長的一段話念到一半就停，所以切成短句排隊念
  function chunks(t) {
    const out = []; let cur = "";
    t.split(/(?<=[。！？；!?;])/).forEach(p => {
      if (cur && (cur + p).length > 110) { out.push(cur); cur = p; } else cur += p;
    });
    if (cur.trim()) out.push(cur);
    return out;
  }
  // 破音字：只改「念出來的音」，畫面上的字不變
  const PRON = [
    [/(溫|平|柔|緩|謙)和/g, "$1荷"], [/和(平|諧|藹|善)/g, "荷$1"], [/和/g, "漢"],
    [/(適|不)當/g, "$1蕩"],               // 不當、適當：ㄉㄤˋ
    [/(^|[^首京成])都(?!市)/g, "$1兜"],
    [/努不努力/g, "努力不努力"],
  ];
  function pron(t) { PRON.forEach(([a, b]) => { t = t.replace(a, b); }); return t; }
  let speakId = 0;
  function speak(text, btn) {
    if (!synth || !window.SpeechSynthesisUtterance) {
      notice("這個瀏覽器不支援朗讀。請按右上角「⋯」選「用瀏覽器開啟」，改用 Chrome 或 Safari 開這個網頁。");
      return;
    }
    if (speakingBtn === btn) { stopSpeak(); return; }
    if (synth.speaking || synth.pending) synth.cancel();
    if (speakingBtn) speakingBtn.classList.remove("on");
    speakingBtn = null;
    if (!zhVoice) pickVoice();
    const id = ++speakId;
    const parts = chunks(pron(text.replace(/✓|✕|🎉|🎬/g, "").replace(/\s+/g, " ")));
    let started = false;
    parts.forEach((p, k) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = "zh-TW"; if (zhVoice) u.voice = zhVoice; u.rate = 0.95; u.volume = 1;
      u.onstart = () => { started = true; };
      if (k === parts.length - 1) u.onend = () => { if (id === speakId && speakingBtn === btn) stopSpeak(); };
      u.onerror = e => { if (id === speakId && speakingBtn === btn && e.error !== "interrupted" && e.error !== "canceled") stopSpeak(); };
      synth.speak(u);
    });
    speakingBtn = btn; if (btn) btn.classList.add("on");
    if (synth.paused) synth.resume();
    setTimeout(() => {
      if (id === speakId && !started && !synth.speaking) {
        stopSpeak();
        notice("沒有聽到聲音嗎？請確認：手機不是靜音模式、媒體音量有開大；Android 請到「設定 → 文字轉語音」確認已安裝中文語音。");
      }
    }, 3000);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-read]");
    if (!b) return;
    const text = Array.from(document.querySelectorAll(b.dataset.read)).map(el => el.innerText.replace(/\n/g, "")).join("。");
    speak(text, b);
  });

  build();
})();
</script>
</body>
</html>
