<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藏寶圖第三站：愛心拼圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 和看見星世界系列同一套配色：淺藍灰底、深藍字、橘色重點；只用淺色主題 */
:root {
  --paper: #DEE5EE;
  --card: #F7F9FB;
  --navy: #141B7A;
  --ink: #1E2748;
  --muted: #3B4260;
  --orange: #E8673C;
  --coral: #F3835E;
  --yellow: #FFE04F;
  --sky: #CFDDF0;
  --line: #B9C8DC;
  --green: #1F6E2A;
  --ok: #2E8A3A;
  --ok-bg: #E5F5E2;
  --no-bg: #FDE9E0;
  --f-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: only light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 14px 16px 28px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* 頂部 */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.station { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; font-family: var(--f-display); font-size: 1.05rem; padding: 4px 16px 4px 6px; border-radius: 999px; white-space: nowrap; }
.station .no { background: var(--yellow); color: var(--navy); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.top .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 3px solid var(--navy); background: #fff; color: var(--navy); font-weight: 700; font-size: 1rem; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
.pill svg { width: 20px; height: 20px; }
.pill.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill[aria-pressed="false"] .wave { display: none; }

/* 題目區 */
.hero { margin-top: 14px; background: var(--card); border: 3px solid var(--line); border-radius: 28px; padding: 12px 20px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; color: var(--navy); font-size: clamp(1.5rem, 5vw, 2.3rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.hero .lead { margin: 2px 0 0; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.15rem); }
.hero .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.prog { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--navy); }
.prog i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--navy); background: #fff; transition: background .3s, transform .3s; }
.prog i.on { background: var(--ok); border-color: var(--ok); transform: scale(1.15); }

/* 拼圖：左邊心形拼板、右邊五片拼圖 */
.game { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; align-items: start; }
.board { padding: 0; }
.board svg { overflow: visible; display: block; width: 100%; height: auto; max-height: 78vh; margin: 0 auto; touch-action: manipulation; }
.slot { cursor: pointer; }
.slot .bg { fill: #EEF2F7; transition: fill .3s; }
.slot .clue { font-family: var(--f-display); font-size: 19px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
.slot .q { font-family: var(--f-display); font-size: 15px; fill: #8A92A8; text-anchor: middle; pointer-events: none; }
.picking .slot:not(.done) .bg { animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { fill: #FFE6D6; } }
.slot.hover .bg { fill: #FFD3BD !important; animation: none !important; }
.slot.done { cursor: default; }
.slot.done .bg { fill: var(--c); }
.slot.done .clue, .slot.done .q { display: none; }
.slot .lbl, .slot .pic { display: none; font-family: var(--f-display); font-size: 22px; fill: var(--navy); text-anchor: middle; pointer-events: none; }
.slot.done .lbl, .slot.done .pic { display: inline; }
.slot.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(.7); opacity: .2; } }
.slot.bad .bg { fill: #F7B9A4; }
.seams { stroke: #fff; stroke-width: 7; pointer-events: none; }
.outline { fill: none; stroke: var(--navy); stroke-width: 7; stroke-linejoin: round; pointer-events: none; }
.board.full .heart-all { animation: beat 1.1s ease-in-out 2; transform-box: fill-box; transform-origin: center; }
@keyframes beat { 30% { transform: scale(1.05); } 60% { transform: scale(.98); } }

.tray { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tray-h { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); color: var(--navy); font-size: 1.2rem; font-weight: 400; }
.tile { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 64px; padding: 8px 12px; background: var(--c); border: 4px solid var(--navy); border-radius: 20px; box-shadow: 0 5px 0 var(--navy); text-align: left; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .15s, box-shadow .15s, opacity .3s; }
.tile:last-child:nth-child(even) { grid-column: 1 / -1; }
.tile:focus-visible { outline: 5px solid var(--orange); outline-offset: 3px; }
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
.tile .ico { flex: none; width: 40px; height: 40px; background: #fff; border-radius: 12px; padding: 2px; }
.tile .t { font-family: var(--f-display); color: var(--navy); font-size: clamp(1.15rem, 3.8vw, 1.4rem); line-height: 1.2; }
.tile.sel { border-color: var(--orange); box-shadow: 0 5px 0 var(--orange), 0 0 0 4px #FFD3BD; transform: translateY(-3px); }
.tile.used { opacity: .28; pointer-events: none; box-shadow: none; transform: none; }
.tile.dragging { opacity: .4; }
.tile.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; width: auto; min-height: 0; transform: translate(-50%, -120%) rotate(-4deg); box-shadow: 0 10px 22px rgba(20, 27, 122, .35); }

/* 每放對一片就出現說明 */
.exp-box { display: none; margin-top: 14px; background: var(--ok-bg); border: 3px solid #9FD19A; border-radius: 22px; padding: 12px 16px; font-size: clamp(1.05rem, 3.3vw, 1.22rem); }
.exp-box.show { display: block; animation: rise .35s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes rise { from { transform: scale(.94); opacity: 0; } }
.exp-box .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-family: var(--f-display); color: var(--green); font-size: 1.25rem; }
.exp-box .row .grow { flex: 1; }
.exp-box b { color: var(--navy); }

/* 放錯提示：底部卡片 */
.sheet-bg, .win-bg { position: fixed; inset: 0; z-index: 40; background: rgba(20, 27, 122, .35); display: flex; align-items: flex-end; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.show, .win-bg.show { opacity: 1; pointer-events: auto; }
.sheet { width: min(640px, 100%); background: var(--no-bg); border: 4px solid var(--orange); border-radius: 28px; padding: 18px 20px 20px; transform: translateY(40px); transition: transform .3s; max-height: 90vh; overflow: auto; }
.sheet-bg.show .sheet { transform: none; }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .verdict { font-family: var(--f-display); font-size: clamp(1.5rem, 5vw, 2rem); color: #A8401A; flex: 1; }
.sheet p { margin: 8px 0 14px; font-size: clamp(1.1rem, 3.6vw, 1.3rem); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--orange); color: #fff; font-family: var(--f-display); font-size: clamp(1.25rem, 4vw, 1.5rem); padding: 10px 28px; border-radius: 999px; box-shadow: 0 5px 0 #A8401A; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #A8401A; }
.btn.ghost-btn { background: #fff; color: var(--navy); border: 3px solid var(--navy); box-shadow: 0 5px 0 var(--navy); }

/* 拼完：守護的心 + 關卡章 */
.win-bg { align-items: center; background: rgba(20, 27, 122, .55); }
.win { width: min(720px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--card); border: 5px solid var(--yellow); border-radius: 32px; padding: 18px 20px 22px; text-align: center; transform: scale(.85); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
.win-bg.show .win { transform: none; }
.win-title { font-family: var(--f-display); color: var(--green); font-size: clamp(1.8rem, 6.5vw, 2.6rem); line-height: 1.2; margin: 0; }
.win-body { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: center; justify-items: center; }
.scene { position: relative; width: min(280px, 62vw); margin: 18px 30px 0 0; }
.scene .mini { display: block; width: 100%; height: auto; transform: scale(.5); opacity: 0; transition: transform .6s cubic-bezier(.2, 1.5, .4, 1) .15s, opacity .3s .15s; }
.win-bg.show .scene .mini { transform: none; opacity: 1; }
.stamp { position: absolute; right: -24%; top: -16%; width: 36%; transform: scale(.2) rotate(-30deg); opacity: 0; transition: transform .7s cubic-bezier(.2, 1.5, .4, 1) .8s, opacity .3s .8s; }
.win-bg.show .stamp { transform: scale(1) rotate(-8deg); opacity: 1; }
.win .exp { background: var(--ok-bg); border: 3px solid #9FD19A; border-radius: 20px; padding: 12px 16px; text-align: left; font-size: clamp(1.05rem, 3.3vw, 1.22rem); margin: 6px 0 0; }
.win .exp b { color: var(--navy); }
.win .exp .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-family: var(--f-display); color: var(--green); font-size: 1.25rem; }
.win .exp .row .grow { flex: 1; }
.win .show-staff { margin: 12px 0 14px; font-weight: 700; color: var(--navy); font-size: clamp(1.05rem, 3.4vw, 1.2rem); }
.win .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.got { display: none; align-items: center; gap: 10px; margin-top: 18px; background: #fff; border: 3px dashed var(--green); border-radius: 22px; padding: 10px 14px; }
.got.show { display: flex; }
.got svg { width: 64px; height: 64px; flex: none; }
.got .t { flex: 1; font-weight: 700; color: var(--green); font-size: 1.1rem; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* 寬螢幕、手機橫放：拼板和拼圖片左右並排 */
@media (min-width: 760px), (orientation: landscape) and (min-width: 560px) {
  .game { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .tray { grid-template-columns: 1fr; }
  .tile:last-child:nth-child(even) { grid-column: auto; }
  .win-body { grid-template-columns: auto 1fr; gap: 18px; }
}
/* 手機橫放（高度很矮）：壓縮版面 */
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 8px; padding-bottom: 12px; }
  .hero { margin-top: 8px; padding: 6px 14px; border-radius: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; }
  .hero h1 { font-size: 1.35rem; }
  .hero .lead { display: none; }
  .hero .tools { margin-top: 0; }
  .game { margin-top: 10px; gap: 12px; }
  .board svg { max-height: calc(100dvh - 105px); }
  .tray { gap: 8px; }
  .tray-h { font-size: 1rem; }
  .tile { min-height: 0; padding: 4px 10px; border-radius: 16px; }
  .tile .ico { width: 32px; height: 32px; }
  .tile .t { font-size: 1.15rem; }
  .win { padding: 10px 16px 14px; }
  .win-title { font-size: 1.7rem; }
  .scene { width: 170px; }
  .win .exp { font-size: 1rem; }
  .win .show-staff { margin: 6px 0 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* 愛心拼圖：只有五個詞，靠形狀拼 */
.slot .bg { stroke: #fff; stroke-width: 5; stroke-linejoin: round; }
.tray { display: flex; flex-wrap: wrap; gap: 12px 14px; justify-content: center; align-items: center; align-content: center; }
.lbl { font-family: var(--f-display); font-size: 22px; fill: var(--navy); text-anchor: middle; pointer-events: none; }
.piece { position: relative; background: none; border: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .15s; }
.piece svg { display: block; width: calc(var(--w) * var(--u, 1px)); height: calc(var(--h) * var(--u, 1px)); overflow: visible; }
.piece polygon { stroke: var(--navy); stroke-width: 5; stroke-linejoin: round; }
.piece:focus-visible { outline: 5px solid var(--orange); outline-offset: 3px; border-radius: 12px; }
.piece.sel { transform: translateY(-5px) scale(1.04); }
.piece.sel polygon { stroke: var(--orange); stroke-width: 8; }
.piece.used { display: none; }
.piece.dragging { opacity: .3; }
.piece.shake { animation: shake .45s; }
.piece.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 8px 10px rgba(20, 27, 122, .35)); }
.piece.ghost svg { width: calc(var(--w) * var(--ub, 1px)); height: calc(var(--h) * var(--ub, 1px)); }
.scene { margin: 14px auto 4px; }
.hero { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.hero .tools { margin-top: 0; }

/* 愛心在中間，拼圖片分在兩側（手機直放時在愛心下面） */
.hero h1 { font-size: clamp(1.05rem, 3.4vw, 1.45rem); }
.game { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "board board" "l r"; align-items: center; }
.board { grid-area: board; }
#trayL { grid-area: l; } #trayR { grid-area: r; }
.tray { flex-direction: column; flex-wrap: nowrap; }
@media (min-width: 760px), (orientation: landscape) and (min-width: 560px) {
  .game { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "l board r"; }
  .board svg { width: auto; height: calc(100dvh - 190px); min-height: 280px; max-width: 58vw; max-height: none; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { padding-top: 6px; padding-bottom: 6px; }
  .hero { margin-top: 6px; padding: 3px 12px; border-radius: 16px; gap: 2px 12px; }
  .hero h1 { font-size: 1rem; }
  .pill { padding: 2px 10px; font-size: .9rem; }
  .prog i { width: 14px; height: 14px; }
  .game { margin-top: 6px; gap: 8px; }
  .board svg { height: calc(100dvh - 120px); min-height: 0; max-height: none; }
  .tray { gap: 6px; }
}
.tray.two { flex-direction: row; flex-wrap: wrap; }
</style>
</head>

<script>

  /* ---------- 五片拼圖 ---------- */
  const SUPS = [
    { id: "beh", label: "行為治療", c: "#9DC3F0" },
    { id: "speech", label: "語言治療", c: "#F9B48F" },
    { id: "med", label: "藥物治療", c: "#8FDAAE" },
    { id: "school", label: "學校教育介入", lines: ["學校教育", "介入"], c: "#FFDB6E" },
    { id: "family", label: "家長協助", c: "#D5C2F0" },

  /* ---------- 愛心切成五塊：從中心往外切 ---------- */

  const C = [200, 166];

  const SPOT = [[276, 138], [270, 244], [200, 284], [130, 244], [124, 138]];  // 每塊放字的位置，圖放在字的上面

  // 沿著愛心外框取點，依角度分到五塊，做成每一塊的多邊形

    const ns = "http://www.w3.org/2000/svg", sv = document.createElementNS(ns, "svg"), p = document.createElementNS(ns, "path");

  };

  function boardSVG() {

    if (g) g.classList.add("hover");

  }, { passive: false });

    if (!d.moved) return;

  });

  const again = () => { stopSpeak(); $("#win").classList.remove("show"); build(); sfx("tap"); window.scrollTo({ top: 0, behavior: "smooth" }); };
  $("#again").onclick = again;
  $("#again2").onclick = again;

  /* ---------- 音效 ---------- */

  function ctx() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch (e) { return null; } }

    else if (kind === "no") { tone(c, 220, 0, .22, "sawtooth", .08); tone(c, 175, .16, .3, "sawtooth", .08); }

  }
  function cheerSound() {

    [1568, 1976, 2349, 3136].forEach((f, i) => tone(c, f, .1 + i * .07, .4, "sine", .08));
    [523, 659, 784, 1047].forEach((f, i) => tone(c, f, .35 + i * .09, i === 3 ? .5 : .14, "triangle", .22));

    const g = c.createGain(), t = c.currentTime + .35;

      o.type = "sawtooth"; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t0 + .35);

  }

  // 手機會把太長的一段話念到一半就停，所以切成短句排隊念

    return out;
  }
  // 破音字：只改「念出來的音」，畫面上的字不變
  const PRON = [
    [/(溫|平|柔|緩|謙)和/g, "$1荷"], [/和(平|諧|藹|善)/g, "荷$1"], [/和/g, "漢"],
    [/(適|不)當/g, "$1蕩"],               // 不當、適當：ㄉㄤˋ
    [/(^|[^首京成])都(?!市)/g, "$1兜"],
    [/調(整|適|節)/g, "條$1"],
  ];
  function pron(t) { PRON.forEach(([a, b]) => { t = t.replace(a, b); }); return t; }
  let speakId = 0;
  function speak(text, btn) {
    if (!synth || !window.SpeechSynthesisUtterance) {
      notice("這個瀏覽器不支援朗讀。請按右上角「⋯」選「用瀏覽器開啟」，改用 Chrome 或 Safari 開這個網頁。");
      return;
    }
    if (speakingBtn === btn) { stopSpeak(); return; }
    if (synth.speaking || synth.pending) synth.cancel();
    if (speakingBtn) speakingBtn.classList.remove("on");
    speakingBtn = null;
    if (!zhVoice) pickVoice();
    const id = ++speakId;
    const parts = chunks(pron(text.replace(/✓|✕|🎉|🎬/g, "").replace(/\s+/g, " ")));
    let started = false;
    parts.forEach((p, k) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = "zh-TW"; if (zhVoice) u.voice = zhVoice; u.rate = 0.95; u.volume = 1;
      u.onstart = () => { started = true; };
      if (k === parts.length - 1) u.onend = () => { if (id === speakId && speakingBtn === btn) stopSpeak(); };
      u.onerror = e => { if (id === speakId && speakingBtn === btn && e.error !== "interrupted" && e.error !== "canceled") stopSpeak(); };
      synth.speak(u);
    });
    speakingBtn = btn; if (btn) btn.classList.add("on");
    if (synth.paused) synth.resume();
    setTimeout(() => {
      if (id === speakId && !started && !synth.speaking) {
        stopSpeak();
        notice("沒有聽到聲音嗎？請確認：手機不是靜音模式、媒體音量有開大；Android 請到「設定 → 文字轉語音」確認已安裝中文語音。");
      }
    }, 3000);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-read]");
    if (!b) return;
    const text = Array.from(document.querySelectorAll(b.dataset.read)).map(el => el.innerText.replace(/\n/g, "")).join("。");
    speak(text, b);
  });


  build();
})();
</script>
</body>
</html>
